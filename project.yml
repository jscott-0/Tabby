# XcodeGen spec. Run `xcodegen generate` to create Tabby.xcodeproj (not committed).
# Signing team and bundle ID live in Config/Tabby.xcconfig, overridable in Config/Local.xcconfig.
name: Tabby
options:
  bundleIdPrefix: com.tabbyapp
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Tabby.xcconfig
  Release: Config/Tabby.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  TabbyKit:
    path: TabbyKit
targets:
  Tabby:
    type: application
    platform: iOS
    sources: [Tabby, SharedUI]
    dependencies:
      - package: TabbyKit
        product: TabbyKit
      - target: TabbyShare
    info:
      path: Tabby/Info.plist
      properties:
        CFBundleDisplayName: Tabby
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        TabbyAppGroup: $(TABBY_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [tabby]
    entitlements:
      path: Tabby/Tabby.entitlements
      properties:
        com.apple.security.application-groups: [$(TABBY_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TABBY_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
  TabbyShare:
    type: app-extension
    platform: iOS
    sources: [TabbyShare, SharedUI]
    dependencies:
      - package: TabbyKit
        product: TabbyKit
    info:
      path: TabbyShare/Info.plist
      properties:
        CFBundleDisplayName: Tabby
        TabbyAppGroup: $(TABBY_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: TabbyShare/TabbyShare.entitlements
      properties:
        com.apple.security.application-groups: [$(TABBY_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TABBY_BUNDLE_ID).share
        TARGETED_DEVICE_FAMILY: "1"
  TabbyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TabbyUITests]
    dependencies:
      - target: Tabby
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TABBY_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tabby
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Tabby:
    build:
      targets:
        Tabby: all
        TabbyShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TabbyUITests
